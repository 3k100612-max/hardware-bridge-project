<!DOCTYPE html>
<html>
<head>
    <title>Hardware Dashboard</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .status { padding: 10px; border-radius: 5px; margin: 10px 0; font-weight: bold; }
        .online { background: #d4edda; color: #155724; }
        .offline { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hardware Monitor</h1>
        <div id="status" class="status offline">Local Agent: Offline</div>
        <p>Serial Number: <span id="serial">----</span></p>
        <a href="/agent.exe" download style="display:inline-block; margin-top:10px; padding:10px; background:#007bff; color:white; text-decoration:none; border-radius:5px;">Download Agent.exe</a>
    </div>

    <script>
        async function update() {
            try {
                const res = await fetch('http://localhost:5000/serial');
                const serial = await res.text();
                document.getElementById('status').innerText = "Local Agent: Online";
                document.getElementById('status').className = "status online";
                document.getElementById('serial').innerText = serial;
            } catch (e) {
                document.getElementById('status').innerText = "Local Agent: Offline";
                document.getElementById('status').className = "status offline";
                document.getElementById('serial').innerText = "----";
            }
        }
        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
